name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: cdrl
      POSTGRES_USER: cdrl_dev
      POSTGRES_PASSWORD: cdrl_dev_only
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify reproducibility contract
        shell: bash
        run: |
          set -euo pipefail
          make setup
          make verify